<svg xmlns="http://www.w3.org/2000/svg" width="550" height="500" viewBox="0 0 550 500">
  <!-- The Connection Checker's green ground (static/ui/checker.uikitml): its art-deco lines, a shade darker than the
       site's Verdigris (#5F7A6B). A cross through the middle, two diamonds round it, and chevrons at the top and
       bottom, as in the design. Each line is a thin filled bar: UIKit fills an SVG's outlines (it ignores
       fill="none"), so strokes can't be used. -->
