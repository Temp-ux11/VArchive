    <rect x="22.0" y="247.0" width="506.0" height="6" transform="rotate(90.00 275 250)"/>
    <rect x="-3.0" y="247.0" width="556.0" height="6" transform="rotate(0.00 275 250)"/>
    <rect x="227.8" y="132.0" width="349.4" height="6" transform="rotate(42.05 402.5 135)"/>
    <rect x="227.8" y="362.0" width="349.4" height="6" transform="rotate(137.95 402.5 365)"/>
    <rect x="-27.2" y="362.0" width="349.4" height="6" transform="rotate(-137.95 147.5 365)"/>
    <rect x="-27.2" y="132.0" width="349.4" height="6" transform="rotate(-42.05 147.5 135)"/>
    <rect x="245.1" y="177.0" width="214.9" height="6" transform="rotate(42.09 352.5 180)"/>
    <rect x="245.1" y="317.0" width="214.9" height="6" transform="rotate(137.91 352.5 320)"/>
    <rect x="90.1" y="317.0" width="214.9" height="6" transform="rotate(-137.91 197.5 320)"/>
    <rect x="90.1" y="177.0" width="214.9" height="6" transform="rotate(-42.09 197.5 180)"/>
    <rect x="19.4" y="94.5" width="296.3" height="6" transform="rotate(42.21 167.5 97.5)"/>
    <rect x="234.4" y="94.5" width="296.3" height="6" transform="rotate(-42.21 382.5 97.5)"/>
    <rect x="19.4" y="399.5" width="296.3" height="6" transform="rotate(-42.21 167.5 402.5)"/>
    <rect x="234.4" y="399.5" width="296.3" height="6" transform="rotate(42.21 382.5 402.5)"/>
  </g>
</svg>
